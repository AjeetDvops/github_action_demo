name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [dev, staging, production]
      artifact_name:
        description: 'Uploaded artifact name to deploy (from build-publish workflow)'
        required: true
        type: string
      version:
        description: 'Version identifier (git SHA or tag)'
        required: true
        type: string
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.5'

      - name: Terraform init
        working-directory: infra/environments/${{ inputs.environment }}
        run: terraform init

      - name: Terraform apply
        working-directory: infra/environments/${{ inputs.environment }}
        run: |
          terraform apply -auto-approve \
            -var="artifact_path=../../../dist/lambda.zip" \
            -var="app_version=${{ inputs.version }}"

      - name: Get function URL
        id: tf-output
        working-directory: infra/environments/${{ inputs.environment }}
        run: |
          echo "function_url=$(terraform output -raw function_url)" >> "$GITHUB_OUTPUT"
          echo "function_name=$(terraform output -raw function_name)" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          FUNCTION_URL: ${{ steps.tf-output.outputs.function_url }}
        run: ./scripts/smoke-test.sh
