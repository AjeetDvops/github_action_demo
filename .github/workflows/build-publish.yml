name: Build & Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_dev_deploy:
        description: 'Skip triggering the automatic dev deploy (useful for manual test runs)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  ARTIFACT_NAME: lambda-${{ github.sha }}

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ env.ARTIFACT_NAME }}
      version: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build lambda
        uses: ./.github/actions/build-lambda
        with:
          go-version: '1.22'
          goarch: arm64

      - name: Upload artifact (GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/lambda.zip
          retention-days: 90

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Upload artifact to S3
        env:
          ARTIFACT_S3_BUCKET: ${{ vars.ARTIFACT_S3_BUCKET || 'demo-github-action-artifacts-bucket' }}
        run: |
          bucket="$(echo -n "${ARTIFACT_S3_BUCKET}" | xargs)"
          aws s3 cp dist/lambda.zip \
            "s3://${bucket}/lambda-cicd-demo/${{ github.sha }}/lambda.zip"

  trigger-dev-deploy:
    name: Trigger Dev Deploy
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_dev_deploy != true }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch deploy workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
              inputs: {
                environment: 'dev',
                artifact_name: '${{ needs.build.outputs.artifact-name }}',
                version: '${{ needs.build.outputs.version }}'
              }
            });
