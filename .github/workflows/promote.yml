name: Promote

on:
  workflow_dispatch:
    inputs:
      from_environment:
        description: 'Environment to promote from'
        required: true
        type: choice
        options: [dev, staging]
      to_environment:
        description: 'Environment to promote to'
        required: true
        type: choice
        options: [staging, production]
      version:
        description: 'Version (git SHA) currently running in from_environment'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate source environment is healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard invalid promotion path
        run: |
          if [[ "${{ inputs.from_environment }}" == "dev" && "${{ inputs.to_environment }}" == "production" ]]; then
            echo "Cannot promote directly from dev to production; go through staging." >&2
            exit 1
          fi

  promote:
    name: Verify artifact exists in S3
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Check artifact exists
        env:
          ARTIFACT_S3_BUCKET: ${{ vars.ARTIFACT_S3_BUCKET || 'demo-github-action-artifacts-bucket' }}
        run: |
          bucket="$(echo -n "${ARTIFACT_S3_BUCKET}" | xargs)"
          aws s3api head-object \
            --bucket "${bucket}" \
            --key "lambda-cicd-demo/${{ inputs.version }}/lambda.zip"

  deploy:
    name: Deploy promoted artifact
    needs: promote
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ inputs.to_environment }}
      version: ${{ inputs.version }}
    secrets: inherit
